<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>뮤직 플레이어</title>
    <style>
      * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--orca-border) transparent; }
      [hidden] { display: none !important; }
      html, body { height: 100%; }
      :root { --radius: var(--orca-radius, 6px); --hl: #ff5c8a; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font: 13px/1.5 system-ui, 'Segoe UI', 'Malgun Gothic', sans-serif;
        color: var(--orca-foreground);
        background: var(--orca-background);
      }
      body.dragging { outline: 2px dashed var(--hl); outline-offset: -6px; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
      :focus-visible { outline: 2px solid var(--orca-ring); outline-offset: -1px; }
      svg { display: block; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .icon { width: 30px; height: 30px; display: grid; place-items: center; color: var(--orca-muted-foreground); border-radius: var(--radius); flex: none; }
      .icon:hover { background: var(--orca-accent); color: var(--orca-accent-foreground); }
      .icon[aria-pressed='true'] { color: var(--hl); }
      .icon:disabled { opacity: 0.4; cursor: default; background: none; }

      .now { display: flex; gap: 10px; align-items: center; padding: 12px 12px 8px; flex: none; }
      .cover {
        width: 52px; height: 52px; flex: none; border-radius: var(--radius); object-fit: cover;
        background: linear-gradient(160deg, #ff5c8a, #7c4dff); display: grid; place-items: center; color: #fff;
      }
      .cover svg { width: 24px; height: 24px; }
      .meta { min-width: 0; flex: 1; }
      .title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .artist { font-size: 12px; color: var(--orca-muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .lyrics {
        height: 100%; overflow-y: auto; margin: 0;
        padding: 0 8px; text-align: center; border: 1px solid var(--orca-border); border-radius: var(--radius);
        background: var(--orca-card); scroll-behavior: smooth;
        mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
      }
      .lyrics::before, .lyrics::after { content: ''; display: block; height: calc(50% - 16px); }
      .lyrics-wrap { position: relative; flex: none; height: 180px; margin: 0 12px; }
      .lyrics-wrap .yt-screen { border-radius: var(--radius); }
      .lyrics .empty { color: var(--orca-muted-foreground); margin: 0; }
      .line { padding: 4px 2px; color: var(--orca-muted-foreground); cursor: pointer; border-radius: 4px; transition: color 0.2s, transform 0.2s; }
      .line:hover { background: var(--orca-accent); }
      .line span { display: block; font-size: 12px; }
      .line span:first-child { font-size: 14px; }
      .line.current { color: var(--orca-foreground); font-weight: 600; transform: scale(1.04); }
      .line.current span:first-child { color: var(--hl); }
      dialog { color: var(--orca-foreground); background: var(--orca-card); border: 1px solid var(--orca-border); border-radius: var(--radius); padding: 16px; max-width: 280px; }
      dialog::backdrop { background: rgb(0 0 0 / 0.5); }
      dialog p { margin: 0 0 14px; }
      dialog .ask-actions { display: flex; justify-content: flex-end; gap: 6px; }
      dialog button { height: 28px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--orca-border); }
      dialog button.primary { color: #fff; border-color: transparent; background: linear-gradient(160deg, #ff5c8a, #7c4dff); font-weight: 600; }
      .grip { flex: none; height: 10px; margin: 0 12px; cursor: row-resize; touch-action: none; position: relative; }
      .grip::after { content: ''; position: absolute; left: 50%; top: 4px; width: 36px; height: 3px; margin-left: -18px; border-radius: 2px; background: var(--orca-border); }
      .grip:hover::after, .grip.drag::after { background: var(--hl); }
      .sync { display: flex; justify-content: flex-end; align-items: center; gap: 2px; margin: 2px 12px 0; font-size: 11px; color: var(--orca-muted-foreground); flex: none; }
      .sync button { padding: 0 6px; height: 20px; border-radius: 4px; }
      .sync button:hover { background: var(--orca-accent); }

      .seek { display: flex; align-items: center; gap: 8px; padding: 6px 12px 0; font-size: 11px; color: var(--orca-muted-foreground); font-variant-numeric: tabular-nums; flex: none; }
      input[type='range'] { flex: 1; min-width: 0; accent-color: var(--hl); margin: 0; }
      .controls { display: flex; align-items: center; justify-content: center; gap: 2px; padding: 4px 12px; flex: none; }
      .play { width: 40px; height: 40px; border-radius: 50%; color: #fff; background: linear-gradient(160deg, #ff5c8a, #7c4dff); }
      .play:hover { background: linear-gradient(160deg, #ff5c8a, #7c4dff); filter: brightness(1.1); color: #fff; }
      .play svg { width: 18px; height: 18px; fill: currentColor; }
      .volume { display: flex; align-items: center; gap: 4px; width: 96px; margin-left: 6px; }
      .badge { position: relative; }
      .badge::after { content: attr(data-badge); position: absolute; right: 3px; bottom: 2px; font-size: 9px; font-weight: 700; }

      .list-head { display: flex; align-items: center; gap: 2px; padding: 8px 8px 4px 12px; border-top: 1px solid var(--orca-border); margin-top: 6px; flex: none; }
      .list-head h2 { flex: 1; margin: 0; font-size: 12px; font-weight: 600; color: var(--orca-muted-foreground); }
      .playlist { flex: 1 1 30%; min-height: 80px; overflow-y: auto; margin: 0; padding: 0 8px 12px; list-style: none; }
      .playlist li { display: flex; align-items: center; gap: 8px; padding: 0 2px 0 8px; height: 30px; border-radius: var(--radius); cursor: pointer; }
      .playlist li:hover { background: var(--orca-accent); }
      .playlist li.playing { color: var(--hl); font-weight: 600; }
      .playlist .no { width: 18px; flex: none; font-size: 11px; color: var(--orca-muted-foreground); text-align: right; font-variant-numeric: tabular-nums; }
      .playlist .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .playlist .lrc { font-size: 10px; padding: 0 4px; border: 1px solid currentColor; border-radius: 3px; opacity: 0.6; flex: none; }
      .playlist li .icon { width: 24px; height: 24px; visibility: hidden; }
      .playlist li:hover .icon { visibility: visible; }
      .hint { margin: 16px 8px; text-align: center; font-size: 12px; color: var(--orca-muted-foreground); }

      .tabs { display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--orca-border); flex: none; }
      .tabs button { padding: 6px 10px; font-weight: 600; color: var(--orca-muted-foreground); border-bottom: 2px solid transparent; margin-bottom: -1px; }
      .tabs button:hover { color: var(--orca-foreground); }
      .tabs button[aria-selected='true'] { color: var(--orca-foreground); border-bottom-color: var(--hl); }
      .tab-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }

      .yt-form { display: flex; gap: 6px; padding: 12px; flex: none; }
      .yt-form input {
        flex: 1; min-width: 0; height: 30px; padding: 0 10px; font: inherit; color: inherit;
        background: transparent; border: 1px solid var(--orca-input); border-radius: var(--radius);
      }
      .yt-form input::placeholder { color: var(--orca-muted-foreground); }
      .yt-form button { height: 30px; padding: 0 12px; border-radius: var(--radius); color: #fff; background: linear-gradient(160deg, #ff5c8a, #7c4dff); font-weight: 600; }
      .yt-form button:disabled { opacity: 0.5; cursor: default; }
      .yt-status { margin: -4px 12px 4px; font-size: 12px; color: var(--orca-muted-foreground); flex: none; }
      .yt-status.error { color: var(--orca-destructive-foreground); }
      /* 플레이어는 예전 최근 기록 자리(2/5), 나머지는 검색 결과 */
      .yt-player { position: relative; flex: 2 1 0; min-height: 120px; margin: 4px 12px 0; border-radius: var(--radius); overflow: hidden; background: #000; }
      .yt-player video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
      .yt-screen {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        padding: 12px; text-align: center; font-size: 12px; color: var(--orca-muted-foreground); background: center / cover no-repeat var(--orca-card);
      }
      .yt-screen.has-thumb { color: #fff; box-shadow: inset 0 0 0 100vmax rgb(0 0 0 / 0.6); }
      .yt-screen p { margin: 0; }
      .yt-screen.busy { color: #fff; font-size: 13px; background: linear-gradient(110deg, #0b0b0b 30%, #1c1c1c 50%, #0b0b0b 70%) 0 0 / 300% 100%; box-shadow: none; animation: yt-shimmer 1.6s linear infinite; }
      @keyframes yt-shimmer { to { background-position: -300% 0; } }
      .yt-screen.busy .yt-spin { width: 56px; height: 56px; border-width: 4px; }
      .yt-spin { width: 28px; height: 28px; border: 3px solid rgb(255 255 255 / 0.25); border-top-color: #fff; border-radius: 50%; animation: yt-spin 0.8s linear infinite; }
      @keyframes yt-spin { to { transform: rotate(360deg); } }
      .yt-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
      .yt-actions button { height: 28px; padding: 0 12px; border-radius: var(--radius); font-size: 12px; font-weight: 600; color: #fff; background: rgb(255 255 255 / 0.18); }
      .yt-actions button.primary { background: linear-gradient(160deg, #ff5c8a, #7c4dff); }
      .yt-actions button:disabled { opacity: 0.5; cursor: default; }
      .videos li.active .vtitle { color: var(--hl); }
      .videos { flex: 3 1 0; min-height: 0; overflow-y: auto; margin: 0; padding: 0 8px 12px; list-style: none; }
      .videos li { display: flex; gap: 8px; padding: 6px 4px; border-radius: var(--radius); cursor: pointer; }
      .videos li:hover { background: var(--orca-accent); }
      .thumb { position: relative; flex: none; width: 120px; height: 68px; border-radius: 4px; overflow: hidden; background: var(--orca-muted); }
      .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .thumb span { position: absolute; right: 3px; bottom: 3px; padding: 0 4px; font-size: 10px; font-weight: 600; color: #fff; background: rgb(0 0 0 / 0.8); border-radius: 3px; }
      .vinfo { min-width: 0; flex: 1; }
      .vtitle { font-size: 12px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .vmeta { margin-top: 2px; font-size: 11px; color: var(--orca-muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
  </head>
  <body>

      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" /></symbol>

      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 6 9 12l9 6zM6 6v12" /></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="m6 6 9 6-9 6zM18 6v12" /></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" /></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" /></symbol>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="music" aria-selected="true">음악</button>
      <button role="tab" data-tab="youtube" aria-selected="false">유튜브</button>
    </nav>

    <div class="tab-body" id="tab-music">
    <section class="now">
      <div class="cover" id="cover-box"><svg><use href="#i-music" /></svg></div>
      <div class="meta">
        <div class="title" id="title">재생할 곡을 추가하세요</div>
        <div class="artist" id="artist">파일을 끌어다 놓아도 됩니다</div>
      </div>
    </section>

    <div class="lyrics-wrap" id="lyrics-wrap">
      <div class="lyrics" id="lyrics"></div>
      <div class="yt-screen busy" id="music-loading" hidden>
        <div class="yt-spin"></div>
        <p id="music-loading-msg"></p>
      </div>
    </div>
    <div class="sync" id="sync" hidden>
      <span>싱크</span>
      <button id="sync-minus" title="가사를 0.5초 빠르게">-0.5초</button>
      <span id="sync-value">0.0초</span>
      <button id="sync-plus" title="가사를 0.5초 늦게">+0.5초</button>
    </div>

    <div class="seek">
      <span id="pos">0:00</span>
      <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="재생 위치" />
      <span id="dur">0:00</span>

    <div class="controls">
      <button class="icon" id="shuffle" aria-pressed="false" title="셔플"><svg><use href="#i-shuffle" /></svg></button>
      <button class="icon" id="prev" title="이전 곡"><svg><use href="#i-prev" /></svg></button>

    <div class="list-head">

      <button class="icon" id="add-files" title="파일 추가 (음악, .lrc)"><svg><use href="#i-file" /></svg></button>
      <button class="icon" id="add-folder" title="폴더 추가"><svg><use href="#i-folder" /></svg></button>
      <button class="icon" id="reset" title="초기화 (재생 중지, 목록 비우기, 볼륨·반복·셔플 기본값)"><svg><use href="#i-reset" /></svg></button>

    </div>
    <ul class="playlist" id="playlist"></ul>
    </div>

    <div class="tab-body" id="tab-youtube" hidden>
      <form class="yt-form" id="yt-form">
        <input id="yt-query" placeholder="검색어 또는 유튜브 주소" aria-label="검색어 또는 유튜브 주소" />
        <button id="yt-go">검색</button>
      </form>
      <p class="yt-status" id="yt-status">검색어나 유튜브 주소를 입력하세요.</p>
      <div class="yt-player" id="yt-player">
        <video id="yt-video" controls playsinline hidden></video>
        <div class="yt-screen" id="yt-screen">
          <div class="yt-spin" id="yt-spin" hidden></div>
          <p id="yt-msg">검색 결과에서 영상을 누르면 여기에서 재생됩니다.</p>
          <div class="yt-actions" id="yt-actions"></div>
        </div>

        <h2 id="yt-count">검색 결과</h2>
        <button class="icon" id="yt-reset" title="초기화 (재생 중지, 받는 중인 영상 취소, 검색 결과 지우기)"><svg><use href="#i-reset" /></svg></button>
      </div>
      <ul class="videos" id="yt-results"></ul>

      <p id="ask-msg"></p>

        <button id="ask-no">취소</button>

      </div>

    <input type="file" id="file-input" multiple accept="audio/*,.mp3,.flac,.m4a,.ogg,.opus,.wav,.aac,.lrc" hidden />
    <audio id="audio" preload="metadata"></audio>

    <script type="module">
      import { formatTime, lrcMatcher, lyricIndex, nameInfo, nextIndex, parseId3, parseLrc } from './player.js'

      const $ = (id) => document.getElementById(id)
      const audio = $('audio')
      const AUDIO_EXT = /\.(mp3|flac|m4a|mp4|aac|ogg|oga|opus|wav|webm)$/i
      const REPEAT_LABEL = { off: '반복 안 함', all: '전체 반복', one: '한 곡 반복' }

      // ponytail: 재생 목록은 브라우저 File 객체라 패널을 다시 열면 사라진다. 경로 기억이 필요하면 worker로 디스크를 읽어야 한다.
      let tracks = [] // { file, url, title, artist, lyrics, lrcFile, cover }
      let current = -1
      let lyrics = []
      let lyricAt = -2
      let syncOffset = 0
      const prefs = { volume: 0.8, repeat: 'all', shuffle: false }

      const icon = (el, name) => el.querySelector('use').setAttribute('href', `#i-${name}`)
      const savePrefs = () => orca.storage.set('prefs', prefs).catch(() => {})

      // 읽는 중인 곡을 골라도 같은 Promise를 기다려 다 읽은 뒤에 화면을 그린다.
      const readTags = (track) => (track.tagged ??= loadTags(track))

      async function loadTags(track) {
        try {
          // ID3v2는 파일 앞에 있어서 앞부분만 읽는다. 앨범아트가 크면 잘릴 수 있어 넉넉히 잡는다.
          const head = await track.file.slice(0, 4 * 1024 * 1024).arrayBuffer()
          const tags = parseId3(head)
          if (tags.title) track.title = tags.title
          if (tags.artist) track.artist = tags.artist
          if (tags.lyrics && !track.lrcText) track.lrcText = tags.lyrics
          if (tags.picture) track.cover = URL.createObjectURL(new Blob([tags.picture.data], { type: tags.picture.mime }))
        } catch {}
        await loadLrc(track)
      }

      async function loadLrc(track) {
        if (!track.lrcFile) return
        try {
          // 알송 등에서 받은 .lrc는 CP949인 경우가 많다. UTF-8로 깨지면 euc-kr로 다시 읽는다.
          const bytes = await track.lrcFile.arrayBuffer()
          const utf8 = new TextDecoder('utf-8', { fatal: false }).decode(bytes)
          track.lrcText = utf8.includes('�') ? new TextDecoder('euc-kr').decode(bytes) : utf8
        } catch {}
      }

      // 폴더 창으로 고른 곡은 worker가 디스크에서 읽는다. 곡 내용은 재생할 때만 받아 오고, File처럼 name/slice/arrayBuffer를 흉내 낸다.
      const MUSIC_CHUNK = 750 * 1024
      // 패널 요청은 10초에 120번까지라, 모든 곡 요청이 같은 간격표를 나눠 쓴다.
      let nextSlot = 0
      async function paceRequest() {
        const at = Math.max(Date.now(), nextSlot)
        nextSlot = at + 90
        if (at > Date.now()) await sleep(at - Date.now())
      }
      class RemoteFile {
        remote = true
        constructor({ id, path, size }) {
          this.id = id
          this.size = size
          this.webkitRelativePath = path
          this.name = path.split('/').pop()
        }
        blob() {
          return (this.cache ??= this.#load().catch((error) => ((this.cache = null), Promise.reject(error))))
        }
        async #load() {
          // worker의 CHUNK_BYTES와 같아야 한다. 조각 번호로 여러 개를 동시에 요청하고, 요청 시작은 90ms 간격(초당 11번)으로 맞춘다.
          const count = Math.ceil(this.size / MUSIC_CHUNK)
          const parts = new Array(count)
          let next = 0
          let done = 0
          const run = async () => {
            while (next < count) {
              if (this.cancelled) throw new Error('취소됨')
              const i = next++
              await paceRequest()
              if (this.cancelled) throw new Error('취소됨')
              const { data } = await request('music.read', { id: this.id, offset: i * MUSIC_CHUNK })
              const bytes = Uint8Array.from(atob(data), (c) => c.charCodeAt(0))
              if (bytes.length !== Math.min(MUSIC_CHUNK, this.size - i * MUSIC_CHUNK)) throw new Error('읽은 크기가 맞지 않습니다.')
              parts[i] = bytes
              this.onProgress?.(Math.floor((++done / count) * 100))
            }
          }
          try {
            await Promise.all([run(), run(), run()])
          } catch (error) {
            next = count // 나머지 요청도 멈춘다.
            throw error
          }
          return new Blob(parts)
        }
        // 목록에서 뺀 곡은 읽던 것을 멈추고 메모리도 비운다.
        cancel() {
          this.cancelled = true
          this.cache = null
        }
        slice(start, end) {
          return { arrayBuffer: async () => (await this.blob()).slice(start, end).arrayBuffer() }
        }
        arrayBuffer = async () => (await this.blob()).arrayBuffer()
      }

      async function pickFolder() {
        $('add-folder').disabled = true
        try {
          let result
          do result = await request('music.pickFolder', {}, 110000)
          while (result.pending)
          if (result.files?.length) addFiles(result.files.map((f) => new RemoteFile(f)))
          else if (result.files) $('artist').textContent = '그 폴더에는 음악 파일이 없습니다.'
        } catch (error) {
          $('artist').textContent = `폴더를 열지 못했습니다: ${error.message}`
        } finally {
          $('add-folder').disabled = false
        }
      }

      function addFiles(fileList) {
        const files = [...fileList]
        const lrcFor = lrcMatcher(files.filter((f) => /\.lrc$/i.test(f.name)))
        const fresh = files
          .filter((f) => AUDIO_EXT.test(f.name))
          .sort((a, b) => (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name, 'ko'))
          .map((file) => ({ file, url: file.remote ? null : URL.createObjectURL(file), ...nameInfo(file.name), lrcFile: lrcFor(file) }))
        // 이미 있는 곡에 맞는 .lrc만 따로 넣은 경우: 태그를 읽었거나 읽는 중이면 그 뒤에 가사만 이어 읽는다.
        for (const t of tracks) {
          const lrc = lrcFor(t.file)
          if (!lrc || t.lrcFile) continue
          t.lrcFile = lrc
          if (t.tagged) t.tagged = t.tagged.then(() => loadLrc(t))
        }
        tracks.push(...fresh)
        renderList()
        if (current === -1 && fresh.length) play(tracks.length - fresh.length)
        else if (current >= 0 && lrcFor(tracks[current].file)) showTrack()
        // 폴더 창으로 고른 곡은 태그를 읽으려면 곡을 통째로 받아야 해서, 재생할 때 읽는다.
        fresh.filter((t) => !t.file.remote).forEach((t) => readTags(t).then(renderList))
      }

      async function play(index) {
        if (index < 0 || index >= tracks.length) return
        const prev = tracks[current]
        current = index
        $('music-loading').hidden = true // 이전 곡의 로딩 화면이 남지 않게 한다.
        const t = tracks[index]
        if (t.file.remote) {
          // 한 곡만 메모리에 두고, 다른 곡으로 넘어가면 이전 곡 데이터는 버린다.
          if (prev?.file.remote && prev !== t) {
            URL.revokeObjectURL(prev.url)
            prev.url = null
            prev.file.cache = null
          }
          if (!t.url) {
            audio.pause()
            $('title').textContent = t.title
            $('artist').textContent = '곡을 불러오는 중…'
            const showLoading = (percent) => {
              $('music-loading').hidden = false
              $('music-loading-msg').textContent = `곡을 불러오는 중 ${percent}%`
            }
            showLoading(0)
            t.file.onProgress = (percent) => current === index && showLoading(percent)
            try {
              const url = URL.createObjectURL(await t.file.blob())
              if (current !== index || tracks[index] !== t) return void (URL.revokeObjectURL(url), (t.file.cache = null))
              t.url = url
            } catch (error) {
              if (current === index && tracks[index] === t) $('artist').textContent = `곡을 읽지 못했습니다: ${error.message}`
              return
            } finally {
              t.file.onProgress = null
              if ((current === index && tracks[index] === t) || current < 0) $('music-loading').hidden = true
            }
          }
        }
        audio.src = t.url
        prefetchNext()
        audio.play().catch(() => {})
        await showTrack()
      }

      // 다음 곡(셔플이면 건너뜀)을 미리 받아 두면 넘어갈 때 바로 재생된다. 한 곡만 미리 받는다.
      let prefetched = null
      function prefetchNext() {
        if (prefs.shuffle) return
        const next = tracks[nextIndex(current, tracks.length, { repeat: prefs.repeat })]
        if (prefetched && prefetched !== next && prefetched !== tracks[current]) prefetched.file.cache = null
        prefetched = next?.file.remote && next !== tracks[current] ? next : null
        prefetched?.file.blob().catch(() => {})
      }

      async function showTrack() {
        const t = tracks[current]
        await readTags(t)
        if (tracks[current] !== t) return
        $('title').textContent = t.title
        $('artist').textContent = t.artist || '알 수 없는 아티스트'
        const box = $('cover-box')
        box.replaceChildren()
        if (t.cover) Object.assign(box.appendChild(document.createElement('img')), { src: t.cover, alt: '', className: 'cover' })
        else box.innerHTML = '<svg><use href="#i-music" /></svg>'
        lyrics = t.lrcText ? parseLrc(t.lrcText) : []
        syncOffset = 0
        renderLyrics(t.lrcText)
        renderList()
        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, artwork: t.cover ? [{ src: t.cover }] : [] })
        }
      }

      function renderLyrics(raw) {
        const box = $('lyrics')
        lyricAt = -2
        $('sync').hidden = !lyrics.length
        $('sync-value').textContent = '0.0초'
        if (!lyrics.length) {
          box.replaceChildren()
          box.scrollTop = 0
          if (!raw?.trim()) return
          // 시각 태그 없는 일반 가사는 그대로 보여준다.
          const p = Object.assign(document.createElement('p'), { className: 'empty' })
          p.style.whiteSpace = 'pre-wrap'
          p.textContent = raw.trim()
          box.replaceChildren(p)
          box.scrollTop = 0
          return
        }
        box.replaceChildren(
          ...lyrics.map((entry, i) => {
            const div = Object.assign(document.createElement('div'), { className: 'line' })
            div.dataset.i = i
            for (const line of entry.lines.length ? entry.lines : ['♪']) div.appendChild(document.createElement('span')).textContent = line
            return div
          })
        )
        box.scrollTop = 0
        syncLyrics()
      }

      function syncLyrics() {
        const i = lyricIndex(lyrics, audio.currentTime + syncOffset)
        if (i === lyricAt) return
        const box = $('lyrics')
        box.children[lyricAt]?.classList.remove('current')
        lyricAt = i
        const el = box.children[i]
        if (!el) return
        el.classList.add('current')
        box.scrollTop = el.offsetTop - box.clientHeight / 2 + el.offsetHeight / 2
      }

      function renderList() {
        $('count').textContent = tracks.length ? `재생 목록 (${tracks.length})` : '재생 목록'
        const list = $('playlist')
        if (!tracks.length) {
          list.innerHTML = '<p class="hint">+ 버튼이나 폴더 버튼으로 음악을 추가하거나<br />파일을 이 패널에 끌어다 놓으세요.</p>'
          return
        }
        list.replaceChildren(
          ...tracks.map((t, i) => {
            const li = document.createElement('li')
            li.dataset.i = i
            li.className = i === current ? 'playing' : ''
            li.title = t.file.webkitRelativePath || t.file.name
            li.innerHTML = '<span class="no"></span><span class="name"></span><button class="icon" title="목록에서 빼기"><svg><use href="#i-x" /></svg></button>'
            li.querySelector('.no').textContent = i === current && !audio.paused ? '♪' : i + 1
            li.querySelector('.name').textContent = t.artist ? `${t.artist} - ${t.title}` : t.title
            if (t.lrcText || t.lrcFile) li.querySelector('.name').insertAdjacentHTML('afterend', '<span class="lrc">LRC</span>')
            return li
          })
        )
      }

      function removeTrack(i) {
        const [gone] = tracks.splice(i, 1)
        gone.file.cancel?.()
        URL.revokeObjectURL(gone.url)
        if (gone.cover) URL.revokeObjectURL(gone.cover)
        if (i === current) {
          audio.pause()
          audio.removeAttribute('src')
          current = -1
          if (tracks.length) play(Math.min(i, tracks.length - 1))
          else resetNow()
        } else if (i < current) current--
        renderList()
      }

      function resetNow() {
        $('music-loading').hidden = true
        $('title').textContent = '재생할 곡을 추가하세요'
        $('artist').textContent = '파일을 끌어다 놓아도 됩니다'
        $('cover-box').innerHTML = '<svg><use href="#i-music" /></svg>'
        lyrics = []
        renderLyrics('')
        // src만 지우면 currentTime이 남고, pause()가 큐에 넣은 timeupdate가 나중에 0:17 같은 값을 다시 그린다.
        // load()로 미디어 요소를 비워 위치를 0으로 되돌린다.
        audio.load()
        $('seek').max = 0
        $('seek').value = 0
        $('pos').textContent = $('dur').textContent = '0:00'
      }

      const step = (dir) => {
        if (current < 0) return
        // 3초 넘게 들었으면 이전 버튼은 곡 처음으로 (알송, 대부분의 플레이어와 같다)
        if (dir < 0 && audio.currentTime > 3) return void (audio.currentTime = 0)
        play(nextIndex(current, tracks.length, { ...prefs, step: dir }))
      }
      const toggle = () => {
        if (current < 0) return tracks.length && play(0)
        audio.paused ? audio.play().catch(() => {}) : audio.pause()
      }

      function applyPrefs() {
        audio.volume = prefs.volume
        $('volume').value = prefs.volume
        $('shuffle').setAttribute('aria-pressed', prefs.shuffle)
        const rep = $('repeat')
        rep.setAttribute('aria-pressed', prefs.repeat !== 'off')
        rep.dataset.badge = prefs.repeat === 'one' ? '1' : ''
        rep.title = REPEAT_LABEL[prefs.repeat]
      }

      // 이벤트
      $('add-files').onclick = () => $('file-input').click()
      $('add-folder').onclick = pickFolder
      for (const id of ['file-input']) {
        $(id).onchange = (e) => {
          addFiles(e.target.files)
          e.target.value = ''
        }
      }
      // 확인/취소를 Promise<boolean>으로 돌려준다. Esc나 바깥 닫힘은 취소.
      function ask(message) {
        const dialog = $('ask')
        $('ask-msg').textContent = message
        return new Promise((resolve) => {
          const done = (ok) => () => {
            dialog.close()
            resolve(ok)
          }
          $('ask-yes').onclick = done(true)
          $('ask-no').onclick = done(false)
          dialog.oncancel = done(false)
          dialog.showModal()
          $('ask-yes').focus()
        })
      }

      function clearTracks() {
        for (const t of tracks) {
          t.file.cancel?.()
          URL.revokeObjectURL(t.url)
          if (t.cover) URL.revokeObjectURL(t.cover)
        }
        tracks = []
        current = -1
        audio.pause()
        audio.removeAttribute('src')
        resetNow()
        renderList()
      }
      $('clear').onclick = async () => {
        if (tracks.length && (await ask(`재생 목록의 곡 ${tracks.length}개를 모두 비울까요?`))) clearTracks()
      }
      $('reset').onclick = () => {
        clearTracks()
        Object.assign(prefs, { volume: 0.8, repeat: 'all', shuffle: false })
        applyPrefs()
        savePrefs()
      }
      $('play').onclick = toggle
      $('prev').onclick = () => step(-1)
      $('next').onclick = () => step(1)
      $('shuffle').onclick = () => {
        prefs.shuffle = !prefs.shuffle
        applyPrefs()
        savePrefs()
      }
      $('repeat').onclick = () => {
        prefs.repeat = { off: 'all', all: 'one', one: 'off' }[prefs.repeat]
        applyPrefs()
        savePrefs()
      }
      $('volume').oninput = (e) => {
        prefs.volume = Number(e.target.value)
        audio.volume = prefs.volume
        audio.muted = false
      }
      $('volume').onchange = savePrefs
      $('mute').onclick = () => (audio.muted = !audio.muted)
      $('seek').oninput = (e) => (audio.currentTime = Number(e.target.value))
      $('sync-minus').onclick = () => shiftSync(0.5)
      $('sync-plus').onclick = () => shiftSync(-0.5)
      function shiftSync(delta) {
        syncOffset = Math.round((syncOffset + delta) * 10) / 10
        $('sync-value').textContent = `${syncOffset > 0 ? '-' : syncOffset < 0 ? '+' : ''}${Math.abs(syncOffset).toFixed(1)}초`
        syncLyrics()
      }

      $('lyrics').onclick = (e) => {
        const line = e.target.closest('.line')
        if (line) audio.currentTime = Math.max(0, lyrics[line.dataset.i].time - syncOffset)
      }
      $('playlist').onclick = (e) => {
        const li = e.target.closest('li')
        if (!li) return
        if (e.target.closest('button')) removeTrack(Number(li.dataset.i))
        else play(Number(li.dataset.i))
      }

      audio.onplay = audio.onpause = () => {
        icon($('play'), audio.paused ? 'play' : 'pause')
        $('play').title = audio.paused ? '재생' : '일시정지'
        renderList()
      }
      audio.onvolumechange = () => icon($('mute'), audio.muted || audio.volume === 0 ? 'mute' : 'vol')
      audio.onloadedmetadata = () => {
        $('seek').max = audio.duration || 0
        $('dur').textContent = formatTime(audio.duration)
      }
      audio.ontimeupdate = () => {
        if (document.activeElement !== $('seek')) $('seek').value = audio.currentTime
        $('pos').textContent = formatTime(audio.currentTime)
        syncLyrics()
      }
      audio.onended = () => {
        const next = nextIndex(current, tracks.length, { ...prefs, auto: true })
        if (next === -1) return
        if (next === current) {
          audio.currentTime = 0
          audio.play().catch(() => {})
        } else play(next)
      }
      audio.onerror = () => {
        if (current >= 0) $('artist').textContent = '이 형식은 재생할 수 없습니다'
      }

      document.addEventListener('keydown', (e) => {
        if (e.target.matches('input') || $('tab-music').hidden) return
        if (e.code === 'Space') toggle()
        else if (e.key === 'ArrowLeft') audio.currentTime -= 5
        else if (e.key === 'ArrowRight') audio.currentTime += 5
        else return
        e.preventDefault()
      })

      let dragDepth = 0
      document.addEventListener('dragenter', (e) => {
        e.preventDefault()
        dragDepth++
        document.body.classList.add('dragging')
      })
      document.addEventListener('dragleave', () => {
        if (--dragDepth <= 0) document.body.classList.remove('dragging')
      })
      document.addEventListener('dragover', (e) => e.preventDefault())
      document.addEventListener('drop', (e) => {
        e.preventDefault()
        dragDepth = 0
        document.body.classList.remove('dragging')
        showTab('music')
        addFiles(e.dataTransfer.files)
      })

      function showTab(name) {
        for (const tab of document.querySelectorAll('[role=tab]')) tab.setAttribute('aria-selected', tab.dataset.tab === name)
        $('tab-music').hidden = name !== 'music'
        $('tab-youtube').hidden = name !== 'youtube'
        try {
          localStorage.setItem('tab', name)
        } catch {}
      }
      document.querySelector('.tabs').onclick = (e) => e.target.dataset.tab && showTab(e.target.dataset.tab)
      try {
        if (localStorage.getItem('tab') === 'youtube') showTab('youtube')
      } catch {}

      // 유튜브: 패널은 iframe·외부 미디어가 막혀 있어서(CSP) worker가 yt-dlp로 받은 파일을 조각으로 넘겨 blob으로 재생한다.
      let videos = []
      let playing = null // 지금 재생(준비) 중인 영상
      let videoUrl = null
      const video = $('yt-video')
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
      const request = async (name, input, timeoutMs = 30000) => {
        // Orca는 패널 요청을 10초에 120번으로 제한한다. 걸리면 알려준 시간만큼 쉬었다 다시 보낸다.
        for (let tries = 0; ; tries++) {
          try {
            const { output } = await orca.host.call('plugin.request', { name, input, timeoutMs })
            if (output?.error) throw new Error(output.error)
            return output
          } catch (error) {
            if (tries >= 20 || !(error?.code === 'rate_limited' || /너무 많|too many/i.test(error?.message ?? ''))) throw error
            await sleep(error.retryAfterMs ?? 1000)
          }
        }
      }
      function setStatus(message, error = false) {
        $('yt-status').className = error ? 'yt-status error' : 'yt-status'
        $('yt-status').textContent = message
      }
      // 플레이어 자리에 안내 화면을 띄운다. actions: [{ label, primary, run }]
      function screen(message, actions = [], thumb = playing?.thumb, busy = false) {
        const el = $('yt-screen')
        el.hidden = false
        el.classList.toggle('has-thumb', Boolean(thumb) && !busy)
        el.style.backgroundImage = thumb && !busy ? `url("${thumb}")` : ''
        el.classList.toggle('busy', busy)
        $('yt-spin').hidden = !busy
        $('yt-msg').textContent = message
        $('yt-actions').replaceChildren(
          ...actions.map(({ label, primary, run }) => {
            const button = Object.assign(document.createElement('button'), { textContent: label, className: primary ? 'primary' : '' })
            button.onclick = run
            return button
          })
        )
      }
      const loading = (message) => screen(message, [], playing?.thumb, true)
      const openInTab = (v) => ({
        label: '브라우저 탭으로 열기',
        run: async () => {
          try {
            await request('youtube.open', { query: `https://www.youtube.com/watch?v=${v.id}` })
            screen('Orca 브라우저 탭에서 열었습니다.')
          } catch (error) {
            screen(`열지 못했습니다: ${error.message}`)
          }
        }
      })
      function renderVideos() {
        $('yt-count').textContent = videos.length ? `검색 결과 (${videos.length})` : '검색 결과'
        $('yt-results').replaceChildren(
          ...videos.map((v, i) => {
            const li = document.createElement('li')
            li.dataset.i = i
            li.title = v.title
            li.className = v.id === playing?.id ? 'active' : ''
            li.innerHTML = '<div class="thumb"></div><div class="vinfo"><div class="vtitle"></div><div class="vmeta"></div><div class="vmeta"></div></div>'
            const thumb = li.querySelector('.thumb')
            if (v.thumb) thumb.appendChild(Object.assign(document.createElement('img'), { src: v.thumb, alt: '', loading: 'lazy' }))
            if (v.length) thumb.appendChild(document.createElement('span')).textContent = v.length
            li.querySelector('.vtitle').textContent = v.title
            const [channel, stats] = li.querySelectorAll('.vmeta')
            channel.textContent = v.channel
            stats.textContent = [v.views && `조회수 ${v.views}`, v.published].filter(Boolean).join(' · ')
            return li
          })
        )
      }
      async function playVideo(v) {
        playing = v
        renderVideos()
        video.pause()
        video.hidden = true
        loading('준비 중…')
        try {
          // 요청은 최대 2분이라, 다운로드가 길면 worker가 pending을 돌려주고 다시 묻는다.
          let result
          do {
            result = await request('youtube.fetch', { id: v.id }, 110000)
            if (playing !== v) return
          } while (result.pending)
          const { needsYtDlp, size } = result
          if (needsYtDlp) return needYtDlp(v)
          const parts = []
          for (let offset = 0; offset < size; ) {
            const { data } = await request('youtube.chunk', { id: v.id, offset })
            if (playing !== v) return
            const bytes = Uint8Array.from(atob(data), (c) => c.charCodeAt(0))
            if (!bytes.length) break
            await sleep(100) // ponytail: 고정 간격. 10초 120회 제한(초당 12회) 아래로 맞춘다.
            parts.push(bytes)
            offset += bytes.length
            loading(`불러오는 중 ${Math.floor((offset / size) * 100)}%`)
          }
          if (videoUrl) URL.revokeObjectURL(videoUrl)
          videoUrl = URL.createObjectURL(new Blob(parts, { type: 'video/mp4' }))
          video.src = videoUrl
          video.hidden = false
          $('yt-screen').hidden = true
          video.play().catch(() => {})
        } catch (error) {
          if (playing === v) screen(error.message, [openInTab(v)])
        }
      }
      function needYtDlp(v) {
        screen('패널에서 재생하려면 yt-dlp가 필요합니다.', [
          {
            label: 'yt-dlp 설치',
            primary: true,
            run: async (e) => {
              e.target.disabled = true
              loading('yt-dlp 받는 중… (약 18MB)')
              try {
                await request('youtube.install', {}, 120000)
                playVideo(v)
              } catch (error) {
                screen(`설치하지 못했습니다: ${error.message}`, [openInTab(v)])
              }
            }
          },
          openInTab(v)
        ])
      }
      orca.plugin?.on?.('youtube.progress', ({ id, percent }) => {
        if (id === playing?.id && video.hidden) loading(`유튜브에서 받는 중 ${percent}%`)
      })
      // 음악과 유튜브가 겹쳐 나오지 않게 한쪽이 재생되면 다른 쪽을 멈춘다.
      video.addEventListener('play', () => audio.pause())
      audio.addEventListener('play', () => video.pause())

      async function searchYoutube(query) {
        if (!query) return
        $('yt-go').disabled = true
        setStatus('검색 중…')
        try {
          const output = await request('youtube.search', { query })
          if (output.opened) return setStatus('Orca 브라우저 탭에서 열었습니다.')
          if (output.videoId) {
            setStatus('주소의 영상을 재생합니다.')
            return playVideo({ id: output.videoId, title: query, thumb: '' })
          }
          videos = output.videos ?? []
          renderVideos()
          $('yt-results').scrollTop = 0
          setStatus(videos.length ? '영상을 누르면 위에서 재생됩니다.' : '검색 결과가 없습니다.')
        } catch (error) {
          setStatus(`검색하지 못했습니다: ${error.message}`, true)
        } finally {
          $('yt-go').disabled = false
        }
      }
      // 재생과 받는 중인 영상을 멈추고, 메모리와 검색 화면을 처음 상태로 돌린다.
      $('yt-reset').onclick = () => {
        playing = null
        video.pause()
        video.removeAttribute('src')
        video.hidden = true
        if (videoUrl) URL.revokeObjectURL(videoUrl)
        videoUrl = null
        videos = []
        renderVideos()
        $('yt-query').value = ''
        $('yt-go').disabled = false
        setStatus('검색어나 유튜브 주소를 입력하세요.')
        screen('검색 결과에서 영상을 누르면 여기에서 재생됩니다.', [], null)
        request('youtube.reset', {}).catch(() => {}) // worker가 받던 다운로드를 멈추고 임시 파일을 지운다.
      }
      $('yt-form').onsubmit = (e) => {
        e.preventDefault()
        searchYoutube($('yt-query').value.trim())
      }
      $('yt-results').onclick = (e) => {
        const li = e.target.closest('li')
        if (li) playVideo(videos[li.dataset.i])
      }

      if ('mediaSession' in navigator) {
        // 토글이 아니라 명령대로: 재생 중 play, 정지 중 pause가 와도 상태를 뒤집지 않는다.
        const actions = { play: () => (current < 0 ? toggle() : audio.play().catch(() => {})), pause: () => audio.pause(), previoustrack: () => step(-1), nexttrack: () => step(1) }
        for (const [name, fn] of Object.entries(actions)) {
          try {
            navigator.mediaSession.setActionHandler(name, fn)
          } catch {}
        }
      }

      renderList()
      applyPrefs()
      orca.storage
        .get('prefs')
        .then((saved) => {
          if (saved && typeof saved === 'object') Object.assign(prefs, saved)
          applyPrefs()
        })
        .catch(() => {})

      // 가사/플레이어 아래 손잡이를 끌어 높이를 바꾸고, 다음에 열 때도 유지한다.
      for (const grip of document.querySelectorAll('.grip')) {
        const el = $(grip.dataset.target)
        const key = `orca-music-player:h:${grip.dataset.target}`
        const apply = (h) => {
          const max = Math.max(Number(grip.dataset.min), window.innerHeight - 200)
          el.style.flex = 'none'
          el.style.height = `${Math.min(max, Math.max(Number(grip.dataset.min), h))}px`
        }
        try { const saved = Number(localStorage.getItem(key)); if (saved) apply(saved) } catch {}
        grip.onpointerdown = (down) => {
          const startY = down.clientY
          const startH = el.getBoundingClientRect().height
          grip.setPointerCapture(down.pointerId)
          grip.classList.add('drag')
          grip.onpointermove = (move) => apply(startH + move.clientY - startY)
          grip.onpointerup = () => {
            grip.classList.remove('drag')
            grip.onpointermove = grip.onpointerup = null
            try { localStorage.setItem(key, String(Math.round(el.getBoundingClientRect().height))) } catch {}
          }
        }
      }
    </script>
  </body>
</html>
